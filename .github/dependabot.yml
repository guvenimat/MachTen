version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Testcontainers*"
          - "NSubstitute"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/src/MACHTEN.Api"
    schedule:
      interval: weekly
