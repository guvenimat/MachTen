name: Özellik önerisi
description: Template'e eklenmesini istediğiniz bir özellik veya kütüphane önerin
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi ihtiyacı karşılıyor?
      description: Çözmek istediğiniz problem veya eksik gördüğünüz şey
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Öneri
      description: Nasıl çözülmesini öneriyorsunuz? Belirli bir kütüphane öneriyorsanız adı
    validations:
      required: true

  - type: checkboxes
    id: aot-check
    attributes:
      label: Uygunluk
      description: Template kaynak üretimi kullanan, reflection'a dayanmayan araçları tercih eder
      options:
        - label: Önerdiğim kütüphane çalışma zamanında kod üretmiyor ve reflection taramasına dayanmıyor
