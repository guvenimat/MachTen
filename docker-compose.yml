services:

  machten-api:
    build:
      context: .
      dockerfile: src/MACHTEN.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MachtenDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Cache=garnet:6379
    # depends_on alone only waits for the container to start. SQL Server needs
    # ~30s before it accepts connections, and AuthSeeder runs migrations
    # immediately, so without service_healthy the API dies on boot.
    depends_on:
      sqlserver:
        condition: service_healthy
      garnet:
        condition: service_started
    networks:
      - machten-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - machten-net

  garnet:
    image: ghcr.io/microsoft/garnet:latest
    ports:
      - "6379:6379"
    volumes:
      - garnet-data:/data
    networks:
      - machten-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - machten-net

volumes:
  sqlserver-data:
  garnet-data:
  prometheus-data:

networks:
  machten-net:
    driver: bridge
