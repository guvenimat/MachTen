name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MACHTEN.sln

      - name: Build
        run: dotnet build MACHTEN.sln --no-restore -c Release

      - name: Check for vulnerable packages
        run: dotnet list MACHTEN.sln package --vulnerable --include-transitive 2>&1 | tee vuln.log && ! grep -q "has the following vulnerable packages" vuln.log

      # TUnit builds each test project as its own executable on
      # Microsoft.Testing.Platform, so they are run rather than handed to a
      # VSTest host.
      - name: Unit tests
        run: |
          dotnet run --project tests/MACHTEN.Domain.Tests --no-build -c Release
          dotnet run --project tests/MACHTEN.Application.Tests --no-build -c Release

      - name: Architecture tests
        run: dotnet run --project tests/MACHTEN.ArchitectureTests --no-build -c Release

      - name: Integration tests (Testcontainers)
        run: dotnet run --project tests/MACHTEN.Api.IntegrationTests --no-build -c Release

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f src/MACHTEN.Api/Dockerfile -t machten-api:ci .
