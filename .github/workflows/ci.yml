name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MACHTEN.sln

      - name: Build
        run: dotnet build MACHTEN.sln --no-restore -c Release

      - name: Check for vulnerable packages
        run: dotnet list MACHTEN.sln package --vulnerable --include-transitive 2>&1 | tee vuln.log && ! grep -q "has the following vulnerable packages" vuln.log

      - name: Unit tests (Domain + Application)
        run: |
          dotnet test tests/MACHTEN.Domain.Tests --no-build -c Release --logger "trx;LogFileName=domain.trx"
          dotnet test tests/MACHTEN.Application.Tests --no-build -c Release --logger "trx;LogFileName=application.trx"

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/MACHTEN.Api.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/MACHTEN.Api/Dockerfile -t machten-api:ci .
